# Configuración para Render (Blueprint) del servicio web de Urbania 360.
# La base PostgreSQL propia ("urbania-360-db") ya existe y se conecta con DATABASE_URL.
services:
  - type: web
    name: urbania-360
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Internal Database URL de la base "urbania-360-db" (se carga en Environment)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Render las pide al crear el Blueprint: con esto se crea tu usuario
      - key: SEED_ADMIN_NOMBRE
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
