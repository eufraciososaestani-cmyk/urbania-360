# Configuración para Render (Blueprint): crea la base de datos propia de
# Urbania 360 y el servicio web, con las variables ya conectadas.
databases:
  - name: urbania-360-db
    plan: basic-256mb   # plan pago (el gratis permite una sola base por cuenta)
    databaseName: urbania360
    user: urbania

services:
  - type: web
    name: urbania-360
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urbania-360-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render las pide al crear el Blueprint: con esto se crea tu usuario
      - key: SEED_ADMIN_NOMBRE
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
