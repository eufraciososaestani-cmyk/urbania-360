# Configuración para Render (Blueprint): crea el servicio web de Urbania 360.
# No crea una base nueva (el plan gratis permite una sola por cuenta): usa una
# base PostgreSQL existente. Las tablas de la app quedan en su propio schema
# "urbania", separadas de todo lo demás que haya en esa base.
services:
  - type: web
    name: urbania-360
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Render lo pide al crear el Blueprint: pegá la "Internal Database URL"
      # de tu base PostgreSQL de Render
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Render las pide al crear el Blueprint: con esto se crea tu usuario
      - key: SEED_ADMIN_NOMBRE
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
